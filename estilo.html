<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19251e"><title>Nuevo estilo · RUTA 200</title><style>
:root{font-family:system-ui,sans-serif;color:#19251e;background:#eeeae1;--gold:#edc36d;--green:#19251e}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #987023;outline-offset:4px}[hidden]{display:none!important}.app{max-width:540px;margin:auto;min-height:100dvh;background:#fcfbf7;padding-bottom:95px}header{padding:22px 25px;background:var(--green);color:white;display:flex;justify-content:space-between;align-items:center}header strong{letter-spacing:3px}header small{display:block;font-size:10px;margin-top:4px;color:var(--gold)}header a{color:white;font-size:12px}.notice{padding:10px 20px;background:#f5e6c4;font-size:12px;text-align:center;line-height:1.5}.hero{height:155px;background:linear-gradient(0deg,#19251ec9,#19251e22),url('portada-costa.jpg') center/cover;padding:30px 25px;display:flex;align-items:end;color:#fff}.hero p{margin:0;font-size:12px;letter-spacing:2px}.hero b{display:block;font-size:27px;margin-top:7px;letter-spacing:-1px}main{padding:26px 25px}.eyebrow{color:#7c704f;font-size:11px;letter-spacing:2px;text-transform:uppercase}h1{font-size:32px;line-height:1.12;letter-spacing:-1.3px;margin:14px 0 13px}p{line-height:1.6}.muted{color:#6b716b;font-size:14px}.progress{display:flex;gap:7px;margin:20px 0}.progress i{height:4px;border-radius:4px;flex:1;background:#e2e3da}.progress i.on{background:#a37c32}.back{border:0;background:none;padding:10px 0;color:#526153;font-size:14px}label{display:block;font-size:13px;font-weight:650;margin:23px 0 9px}input,select{width:100%;border:1px solid #d4d8cd;background:#f1f3ed;padding:17px;border-radius:14px;color:#19251e;min-height:55px}button.primary,a.primary{display:block;background:var(--green);color:#f8df9d;border:0;width:100%;padding:18px;border-radius:100px;font-weight:750;text-align:center;text-decoration:none;margin-top:28px}button.secondary{border:1px solid #c9cdbf;background:transparent;width:100%;padding:15px;border-radius:100px;margin-top:12px;color:var(--green)}.counter{display:flex;align-items:center;justify-content:space-between;margin:35px 0}.counter button{width:52px;height:52px;border:1px solid #bcb69f;background:transparent;color:#75602d;border-radius:50%;font-size:30px}.counter output{font-size:66px;font-weight:750;letter-spacing:-3px}.counter button:disabled{opacity:.3}.card{border:1px solid #dfe1d5;border-radius:18px;background:#fff;padding:20px;margin:13px 0;width:100%;text-align:left;color:#19251e}.card.selected{border:2px solid #9a772e;background:#fbf6e8}.card .line{display:flex;justify-content:space-between;gap:12px;font-size:19px;font-weight:750}.card small{display:block;color:#657063;margin-top:13px}.tag{display:inline-block;font-size:11px;border-radius:20px;background:#e7eddf;padding:5px 9px;margin-top:13px}.route{border-left:2px solid #b29b61;margin:22px 8px;padding:0 0 0 20px}.route p{margin:0}.route p+p{margin-top:24px}.summary{background:#f2efe5;border-radius:20px;padding:22px;margin-top:22px}.row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;font-size:14px;border-bottom:1px solid #dcd9cc}.row strong{text-align:right}.total{font-size:28px;font-weight:800;margin-top:18px}.success{width:85px;height:85px;border-radius:50%;background:#dce8d3;color:#39603e;display:grid;place-items:center;font-size:46px;margin:25px 0}.nav{position:fixed;bottom:0;width:min(540px,100%);background:#fcfbf7f5;backdrop-filter:blur(14px);border-top:1px solid #dfe1d5;display:flex;padding:12px 10px max(12px,env(safe-area-inset-bottom));gap:5px}.nav button{flex:1;border:0;background:transparent;color:#72786b;padding:10px 0;border-radius:14px;font-size:12px}.nav button.active{background:#ece5d3;color:#443a20;font-weight:750}.nav span{display:block;font-size:20px;margin-bottom:4px}.error{color:#963b24;font-size:14px}@media(min-width:600px){.app{box-shadow:0 12px 80px #19251e18}}@media(prefers-reduced-motion:no-preference){main{animation:arrive .2s ease}@keyframes arrive{from{opacity:.4;transform:translateY(5px)}}}
.map-panel{margin:20px 0;border:1px solid #d9ddcf;border-radius:20px;overflow:hidden;background:#e9eee3}.map-panel iframe{display:block;width:100%;height:145px;border:0;background:#e9eee3}.map-caption{padding:14px 17px}.map-caption strong{display:block;font-size:14px}.map-caption p{font-size:12px;color:#657063;margin:5px 0 8px}.map-caption a{color:#625025;font-size:13px;font-weight:650}.map-disclaimer{font-size:12px;color:#657063}@media(max-width:380px){.map-panel iframe{height:125px}}</style></head><body><div class="app"><header><div><strong>RUTA 200</strong><small>Juntos en el camino</small></div><a href="index.html">Ir a la app actual ↗</a></header><div class="notice"><strong>Muestra de diseño</strong> · Horarios ficticios. No genera reservas ni publica viajes reales.</div><div class="hero"><div><p>TEPIC ⇄ MEZCALES</p><b>Juntos, a tu próximo destino.</b></div></div><main id="screen"></main><nav class="nav" aria-label="Probar los recorridos"><button id="passenger"><span aria-hidden="true">⌕</span>Reservar</button><button id="driver"><span aria-hidden="true">＋</span>Publicar</button><button id="tickets"><span aria-hidden="true">▤</span>Mi prueba</button></nav></div><script>
'use strict';
const screen=document.getElementById('screen');
const now=new Date();const localDate=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
let mode='passenger',step=0,count=1,route='ida',date=localDate,hour='06:00',meeting='',last=null,phoneSeats=0,draftSeats=4;
const origin=()=>route==='ida'?'Tepic':'Mezcales',destination=()=>route==='ida'?'Mezcales':'Tepic';
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatted=()=>date.split('-').reverse().join('/');
const btn=(text='Continuar →')=>'<p id="error" role="alert" class="error"></p><button class="primary" id="next">'+text+'</button>';
function start(value){mode=value;step=0;count=value==='driver'?4:1;phoneSeats=0;draftSeats=count;render();}
function routeMap(){
 const from=encodeURIComponent(origin()+', Nayarit, México'),to=encodeURIComponent(destination()+', Nayarit, México');
 const embed='https://maps.google.com/maps?saddr='+from+'&daddr='+to+'&output=embed';
 const link='https://www.google.com/maps/dir/?api=1&origin='+from+'&destination='+to+'&travelmode=driving';
 return '<section class="map-panel" aria-label="Mapa del recorrido"><iframe title="Mapa de '+origin()+' a '+destination()+'" src="'+embed+'" loading="eager" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe><div class="map-caption"><strong>'+origin()+' → '+destination()+'</strong><p>Recorrido de referencia entre ciudades. Confirma con tu conductor el punto de encuentro y la carretera.</p><a href="'+link+'" target="_blank" rel="noopener">Abrir ruta en Google Maps ↗</a></div></section>';
}
function summary(){return '<div class="summary"><p class="eyebrow">'+(mode==='driver'?'Tu salida de prueba':'Tu viaje de prueba')+'</p><div class="route"><p><strong>'+safe(hour)+' · '+origin()+'</strong><br><small>Hora local de salida</small></p><p><strong>'+destination()+'</strong></p></div><div class="row"><span>Fecha</span><strong>'+formatted()+'</strong></div><div class="row"><span>Asientos</span><strong>'+(mode==='driver'&&step===5?count-phoneSeats:count)+'</strong></div><div class="row"><span>Precio por asiento</span><strong>$250 MXN</strong></div>'+(mode==='driver'?'<div class="row"><span>Encuentro</span><strong>'+safe(meeting)+'</strong></div>':'<div class="row"><span>Pago</span><strong>Al abordar</strong></div>')+'<div class="total">'+(mode==='driver'?'$250 por asiento':'$'+count*250+' MXN')+'</div></div>';}
function seatControls(){return '<section class="summary" aria-labelledby="phone-title"><h2 id="phone-title">Asientos disponibles</h2><div class="counter"><button id="available-minus" aria-label="Reducir asientos disponibles" '+(draftSeats===0?'disabled':'')+'>−</button><output aria-live="polite" aria-label="Asientos disponibles">'+draftSeats+'</output><button id="available-plus" aria-label="Aumentar asientos disponibles" '+(draftSeats===count?'disabled':'')+'>+</button></div><button class="primary" id="save-seats">Aceptar</button><p class="muted" id="seat-status" role="status" aria-live="polite"></p></section>';}
function render(){
 document.getElementById('passenger').classList.toggle('active',mode==='passenger');document.getElementById('driver').classList.toggle('active',mode==='driver');
 let html='<p class="eyebrow">'+(mode==='driver'?'Conductores · Publicar salida':'Pasajeros · Reservar viaje')+'</p>';
 if(step<5)html+='<div class="progress" aria-label="Paso '+(step+1)+' de 5">'+Array.from({length:5},(_,i)=>'<i class="'+(i<=step?'on':'')+'"></i>').join('')+'</div>';
 if(step>0&&step<5)html+='<button class="back" id="back">← Volver</button>';
 if(step===0)html+='<h1>¿A dónde vamos?</h1><p class="muted">Tu ruta de siempre, más fácil desde tu celular.</p><label for="route">Elige el recorrido</label><select id="route"><option value="ida">Tepic → Mezcales</option><option value="vuelta">Mezcales → Tepic</option></select><label for="date">'+(mode==='driver'?'¿Qué día sales?':'¿Cuándo viajas?')+'</label><input type="date" id="date" min="'+localDate+'" value="'+safe(date)+'">'+btn();
 if(step===1)html+='<h1>'+(mode==='driver'?'¿Cuántos lugares ofreces?':'¿Cuántos asientos necesitas?')+'</h1><p class="muted">De 1 a 4 pasajeros por carro.</p><div class="counter"><button id="minus" aria-label="Quitar un asiento" '+(count===1?'disabled':'')+'>−</button><output aria-live="polite">'+count+'</output><button id="plus" aria-label="Agregar un asiento" '+(count===4?'disabled':'')+'>+</button></div><div class="summary">$250 MXN por asiento'+(mode==='passenger'?'<div class="total">$'+count*250+' MXN</div>':'')+'</div>'+btn(mode==='driver'?'Elegir hora →':'Buscar salidas →');
 if(step===2){html+='<h1>'+(mode==='driver'?'¿A qué hora sales?':'Elige tu salida.')+'</h1><p class="muted">'+origin()+' → '+destination()+' · '+formatted()+'<br>Horas locales de '+origin()+'.</p>';
 if(mode==='driver')html+='<label for="hour">Hora de salida</label><input type="time" id="hour" value="'+hour+'">';
 else html+='<span class="tag">Horarios de ejemplo · Asignación automática de carro</span>'+['06:00','08:00','10:00'].map(h=>'<button class="card '+(hour===h?'selected':'')+'" data-hour="'+h+'" aria-pressed="'+(hour===h)+'"><span class="line"><span>'+h+' · '+origin()+'</span><span>$250</span></span><small>Destino: '+destination()+' · 4 lugares de ejemplo</small><span class="tag">Reserva automática · Pago al abordar</span></button>').join('');html+=btn();}
 if(step===3)html+='<h1>'+(mode==='driver'?'¿Dónde se encuentran?':'Revisa tu viaje.')+'</h1>'+(mode==='driver'?'<p class="muted">Escribe un punto fácil de reconocer para tus pasajeros.</p><label for="meeting">Punto de encuentro</label><input id="meeting" maxlength="120" placeholder="Ej. Entrada de la central" value="'+safe(meeting)+'"><p class="muted">Tarifa Ruta 200: $250 MXN por asiento.</p>':summary()+'<p class="muted">El carro se asigna al confirmar, según el espacio para tu grupo. Puedes cancelar hasta 30 minutos antes.</p>')+btn(mode==='driver'?'Revisar salida →':'Continuar →');
 if(step===4)html+='<h1>'+(mode==='driver'?'¿Todo listo para salir?':'Tu lugar está a un paso.')+'</h1>'+summary()+'<p class="muted">Esta prueba muestra cómo se vería la confirmación. No se enviarán datos a los conductores.</p>'+btn(mode==='driver'?'Simular publicación →':'Simular reserva →');
 if(step===5)html+='<div class="success" aria-hidden="true">✓</div><p class="eyebrow">Demostración completada</p><h1>'+(mode==='driver'?'¡Así se verá tu salida publicada!':'¡Así se verá tu confirmación!')+'</h1><p class="muted">Este es un ejemplo visual. No hay un viaje publicado ni un asiento reservado.</p>'+summary()+(mode==='driver'?seatControls():'')+'<button class="primary" id="restart">Probar otra vez →</button><a class="primary" href="acceso.html">Hacer una reserva real ↗</a>';
 if(step===0){const end=html.indexOf('</h1>');if(end!==-1)html=html.slice(0,end+5)+routeMap()+html.slice(end+5);}
 screen.innerHTML=html;
 const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
 if(step===0){const routeField=document.getElementById('route'),dateField=document.getElementById('date');routeField.value=route;routeField.onchange=()=>{date=dateField.value||date;route=routeField.value;render();};dateField.onchange=()=>{date=dateField.value;};}
 bind('available-minus',()=>{draftSeats=Math.max(0,draftSeats-1);render();});
 bind('available-plus',()=>{draftSeats=Math.min(count,draftSeats+1);render();});
 bind('save-seats',()=>{phoneSeats=count-draftSeats;if(last)last.phoneSeats=phoneSeats;render();document.getElementById('seat-status').textContent='Actualizado: '+draftSeats+' asiento(s) disponible(s) en esta prueba.';});

 bind('back',()=>{step--;render();});bind('minus',()=>{count=Math.max(1,count-1);render();});bind('plus',()=>{count=Math.min(4,count+1);render();});bind('restart',()=>start(mode));
 screen.querySelectorAll('[data-hour]').forEach(el=>el.onclick=()=>{hour=el.dataset.hour;render();});
 bind('next',()=>{
 if(step===0){const d=document.getElementById('date');if(!d.value||!d.checkValidity()){document.getElementById('error').textContent='Elige una fecha de hoy en adelante.';d.focus();return;}date=d.value;route=document.getElementById('route').value;}
 if(step===2&&mode==='driver'){const h=document.getElementById('hour');if(!h.value){document.getElementById('error').textContent='Elige una hora de salida.';h.focus();return;}hour=h.value;}
 if(step===3&&mode==='driver'){meeting=document.getElementById('meeting').value.trim();if(meeting.length<3){document.getElementById('error').textContent='Escribe el punto de encuentro.';document.getElementById('meeting').focus();return;}}
 step++;if(step===5)draftSeats=count-phoneSeats;if(step===5)last={mode,route,date,hour,count,meeting,phoneSeats};render();screen.scrollIntoView({block:'start',behavior:'instant'});screen.querySelector('h1')?.setAttribute('tabindex','-1');screen.querySelector('h1')?.focus({preventScroll:true});
 });
}
document.getElementById('passenger').onclick=()=>start('passenger');document.getElementById('driver').onclick=()=>start('driver');document.getElementById('tickets').onclick=()=>{if(last){({mode,route,date,hour,count,meeting,phoneSeats}=last);draftSeats=count-phoneSeats;step=5;render();}else{screen.innerHTML='<p class="eyebrow">Mi prueba</p><h1>Tu recorrido empieza aquí.</h1><p class="muted">Completa una reserva o publicación de demostración y consulta aquí el resultado mientras mantengas esta página abierta.</p><button class="primary" id="begin">Probar una reserva →</button>';document.getElementById('begin').onclick=()=>start('passenger');}};
render();
</script></body></html>
